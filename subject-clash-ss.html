      let selectedCourses = [];

      // Initialize dropdown options
      function initializeDropdown() {
        const select = document.getElementById("courseSelect");
        examData.forEach((course) => {
          const option = document.createElement("option");
          option.value = course.courseNumber;
          option.textContent = `${course.courseNumber} - ${course.courseName}`;
          select.appendChild(option);
        });
      }

      // Find clashes between selected courses
      function findClashes() {
        const clashes = [];

        for (let i = 0; i < selectedCourses.length; i++) {
          for (let j = i + 1; j < selectedCourses.length; j++) {
            const course1 = examData.find(
              (c) => c.courseNumber === selectedCourses[i]
            );
            const course2 = examData.find(
              (c) => c.courseNumber === selectedCourses[j]
            );

            if (course1 && course2) {
              if (course1.midRegular === course2.midRegular) {
                clashes.push(
                  `${course1.courseName} and ${course2.courseName} have clashing Mid Semester Regular exam on ${course1.midRegular}`
                );
              }
              if (course1.midMakeup === course2.midMakeup) {
                clashes.push(
                  `${course1.courseName} and ${course2.courseName} have clashing Mid Semester Makeup exam on ${course1.midMakeup}`
                );
              }
              if (course1.compRegular === course2.compRegular) {
                clashes.push(
                  `${course1.courseName} and ${course2.courseName} have clashing Comprehensive Regular exam on ${course1.compRegular}`
                );
              }
              if (course1.compMakeup === course2.compMakeup) {
                clashes.push(
                  `${course1.courseName} and ${course2.courseName} have clashing Comprehensive Makeup exam on ${course1.compMakeup}`
                );
              }
            }
          }
        }
        return clashes;
      }

      // Update the UI with selected courses and clashes
      function updateUI() {
        // Update selected courses display
        const selectedCoursesDiv = document.getElementById("selectedCourses");
        selectedCoursesDiv.innerHTML = "";

        selectedCourses.forEach((courseNumber) => {
          const course = examData.find((c) => c.courseNumber === courseNumber);
          const courseElement = document.createElement("div");
          courseElement.className = "p-4 bg-gray-50 rounded-md";
          courseElement.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h4 class="font-medium">${course.courseName}</h4>
                            <p class="text-sm text-gray-500">${course.courseNumber}</p>
                        </div>
                        <button onclick="removeCourse('${course.courseNumber}')" class="text-red-500 hover:text-red-700">
                            Remove
                        </button>
                    </div>
                    <div class="grid grid-cols-2 gap-4 mt-2 text-sm">
                        <div>
                            <p class="font-medium">Mid Semester</p>
                            <p>Regular: ${course.midRegular}</p>
                            <p>Make-up: ${course.midMakeup}</p>
                        </div>
                        <div>
                            <p class="font-medium">Comprehensive</p>
                            <p>Regular: ${course.compRegular}</p>
                            <p>Make-up: ${course.compMakeup}</p>
                        </div>
                    </div>
                `;
          selectedCoursesDiv.appendChild(courseElement);
        });

        // Update clashes display
        const clashesDiv = document.getElementById("clashes");
        const clashes = findClashes();
        if (clashes.length > 0) {
          clashesDiv.innerHTML = `
                    <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded">
                        <h3 class="font-bold text-red-800 mb-2">Exam Clashes Found:</h3>
                        <ul class="list-disc pl-4 text-red-800">
                            ${clashes
                              .map((clash) => `<li>${clash}</li>`)
                              .join("")}
                        </ul>
                    </div>
                `;
        } else {
          clashesDiv.innerHTML = "";
        }

        // Update dropdown disabled states
        const select = document.getElementById("courseSelect");
        Array.from(select.options).forEach((option) => {
          option.disabled =
            selectedCourses.includes(option.value) && option.value !== "";
        });
      }

      // Handle course selection
      function handleCourseSelection(e) {
        const value = e.target.value;
        if (value === "") return;

        if (selectedCourses.includes(value)) {
          selectedCourses = selectedCourses.filter(
            (course) => course !== value
          );
        } else if (selectedCourses.length < 4) {
          selectedCourses.push(value);
        }

        e.target.value = "";
        updateUI();
      }

      // Handle course removal
      function removeCourse(courseNumber) {
        selectedCourses = selectedCourses.filter(
          (course) => course !== courseNumber
        );
        updateUI();
      }

      // Initialize the app
      document.addEventListener("DOMContentLoaded", () => {
        initializeDropdown();
        document
          .getElementById("courseSelect")
          .addEventListener("change", handleCourseSelection);
      });
