<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi Video Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #1a1a1a;
      color: #eee;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .file-input-wrapper {
      position: relative;
    }

    .file-input {
      display: none;
    }

    .file-label {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background-color: #333;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .file-label:hover {
      background-color: #444;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #0055aa;
    }

    .btn:disabled {
      background-color: #444;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: #444;
    }

    .btn-secondary:hover {
      background-color: #555;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .video-item {
      position: relative;
      background-color: #222;
      border-radius: 8px;
      overflow: hidden;
    }

    .video-item video {
      width: 100%;
      display: block;
    }

    .video-item .filename {
      padding: 0.5rem;
      font-size: 0.85rem;
      color: #aaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-item .remove-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      background-color: rgba(0, 0, 0, 0.7);
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      font-size: 1.2rem;
      line-height: 1;
      transition: background-color 0.2s;
    }

    .video-item .remove-btn:hover {
      background-color: rgba(200, 0, 0, 0.8);
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #666;
    }

    .empty-state p {
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="controls">
      <div class="file-input-wrapper">
        <input type="file" id="fileInput" class="file-input" multiple accept="video/*">
        <label for="fileInput" class="file-label">Select Videos</label>
      </div>
      <button id="playAllBtn" class="btn" disabled>Play All</button>
      <button id="pauseAllBtn" class="btn btn-secondary" disabled>Pause All</button>
      <button id="clearAllBtn" class="btn btn-secondary" disabled>Clear All</button>
    </div>

    <div id="videoGrid" class="video-grid">
      <div id="emptyState" class="empty-state">
        <p>No videos selected</p>
        <p>Click "Select Videos" to add files</p>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const videoGrid = document.getElementById('videoGrid');
    const emptyState = document.getElementById('emptyState');
    const playAllBtn = document.getElementById('playAllBtn');
    const pauseAllBtn = document.getElementById('pauseAllBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');

    const videos = [];

    function updateButtons() {
      const hasVideos = videos.length > 0;
      playAllBtn.disabled = !hasVideos;
      pauseAllBtn.disabled = !hasVideos;
      clearAllBtn.disabled = !hasVideos;
      emptyState.style.display = hasVideos ? 'none' : 'block';
    }

    function removeVideo(index) {
      videos[index].element.remove();
      videos.splice(index, 1);
      
      document.querySelectorAll('.video-item').forEach((item, i) => {
        item.dataset.index = i;
        item.querySelector('.remove-btn').onclick = () => removeVideo(i);
      });
      
      updateButtons();
    }

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      
      files.forEach((file, i) => {
        if (!file.type.startsWith('video/')) return;

        const videoItem = document.createElement('div');
        videoItem.className = 'video-item';
        videoItem.dataset.index = videos.length;

        const video = document.createElement('video');
        video.src = URL.createObjectURL(file);
        video.controls = true;

        const filename = document.createElement('div');
        filename.className = 'filename';
        filename.textContent = file.name;

        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-btn';
        removeBtn.innerHTML = '&times;';
        removeBtn.onclick = () => {
          const idx = parseInt(videoItem.dataset.index);
          removeVideo(idx);
        };

        videoItem.appendChild(video);
        videoItem.appendChild(removeBtn);
        videoItem.appendChild(filename);
        videoGrid.appendChild(videoItem);

        videos.push({ element: videoItem, video });
      });

      fileInput.value = '';
      updateButtons();
    });

    playAllBtn.addEventListener('click', () => {
      videos.forEach(({ video }) => video.play());
    });

    pauseAllBtn.addEventListener('click', () => {
      videos.forEach(({ video }) => video.pause());
    });

    clearAllBtn.addEventListener('click', () => {
      videos.forEach(({ element }) => element.remove());
      videos.length = 0;
      updateButtons();
    });
  </script>
</body>
</html>
