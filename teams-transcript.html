<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teams transcript to VTT Converter</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        max-width: 800px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      textarea {
        width: 100%;
        min-height: 200px;
        margin: 1rem 0;
        padding: 0.5rem;
        font-family: monospace;
      }
      button {
        background: #0066cc;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background: #0052a3;
      }
      .error {
        color: #cc0000;
        margin: 1rem 0;
      }
    </style>
  </head>
  <body>
    <h1>JSON to VTT Converter</h1>
    <p>Paste your JSON transcript below:</p>
    <textarea id="jsonInput" placeholder="Paste JSON here..."></textarea>
    <button onclick="convertToVTT()">Convert to VTT</button>
    <p>VTT Output:</p>
    <textarea id="vttOutput" readonly></textarea>
    <div id="error" class="error"></div>

    <script>
      function convertTimeFormat(timeStr) {
        // Convert from "HH:mm:ss.SSSSSSS" to "HH:mm:ss.SSS"
        const match = timeStr.match(/(\d{2}):(\d{2}):(\d{2})\.(\d{7})/);
        if (!match) return timeStr;
        return `${match[1]}:${match[2]}:${match[3]}.${match[4].substring(
          0,
          3
        )}`;
      }

      function convertToVTT() {
        const jsonInput = document.getElementById("jsonInput");
        const vttOutput = document.getElementById("vttOutput");
        const errorDiv = document.getElementById("error");

        try {
          errorDiv.textContent = "";
          const data = JSON.parse(jsonInput.value);

          // Start with VTT header
          let vttContent = "WEBVTT\n\n";

          // Process each entry
          data.entries.forEach((entry, index) => {
            const startTime = convertTimeFormat(entry.startOffset);
            const endTime = convertTimeFormat(entry.endOffset);

            vttContent += `${index + 1}\n`;
            vttContent += `${startTime} --> ${endTime}\n`;
            vttContent += `${entry.speakerDisplayName}: ${entry.text}\n\n`;
          });

          vttOutput.value = vttContent;

          // Create download link
          const blob = new Blob([vttContent], { type: "text/vtt" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "transcript.vtt";
          a.click();
          URL.revokeObjectURL(url);
        } catch (error) {
          errorDiv.textContent = `Error: ${error.message}`;
        }
      }

      // Add sample data button
      const sampleButton = document.createElement("button");
      sampleButton.textContent = "Load Sample Data";
      sampleButton.style.marginLeft = "1rem";
      sampleButton.onclick = () => {
        document.getElementById("jsonInput").value = JSON.stringify(
          {
            entries: [
              {
                text: "Hey, how's it going?",
                speakerDisplayName: "John Doe",
                startOffset: "02:04:57.0088152",
                endOffset: "02:05:01.2888152",
              },
            ],
          },
          null,
          2
        );
      };
      document.querySelector("button").after(sampleButton);
    </script>
  </body>
</html>
