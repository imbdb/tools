<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Merge PDFs</title>
    <style>
      /* Simple styling for the file list */
      #fileList {
        list-style: none;
        padding: 0;
        margin: 0 0 10px;
      }
      #fileList li {
        padding: 10px;
        margin: 5px 0;
        background-color: #f0f0f0;
        border: 1px solid #ddd;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .file-controls {
        display: flex;
        gap: 5px;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
  </head>
  <body>
    <main class="container">
      <h2>Upload and Arrange PDFs to Merge</h2>
      <input type="file" id="pdfFiles" multiple accept="application/pdf" />
      <ul id="fileList"></ul>
      <label for="downloadFileName">Merged file name</label>
      <input id="downloadFileName" type="text" value="merged.pdf" />
      <button id="mergeButton">Merge PDFs</button>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script>
      document.getElementById(
        "downloadFileName"
      ).value = `merged-${new Date().toISOString()}.pdf`;
      let selectedFiles = [];
      const backgroundColors = [
        "#b18ea9",
        "#6b8e23",
        "#508b8b",
        "#a899e6",
        "#b0b7b9",
        "#f5f5dc",
        "#d3a427",
        "#d08f7d",
        "#bfc7d6",
        "#a9b7a9",
        "#d39e6b",
        "#64a8a8",
        "#967249",
        "#c1a65c",
        "#aaffc3",
        "#e0b0ff",
        "#677179",
        "#cc7a6f",
        "#c9a3a4",
        "#edc9af",
      ];
      // Handle file input
      document
        .getElementById("pdfFiles")
        .addEventListener("change", function (event) {
          let i = 0;
          selectedFiles = Array.from(event.target.files)
            .sort((a, b) => a.name.localeCompare(b.name))
            .map((file) => {
              return { file, color: backgroundColors[i++] };
            });
          renderFileList();
        });

      // Render the list of uploaded files with Move Up/Down buttons
      function renderFileList() {
        const fileList = document.getElementById("fileList");
        fileList.innerHTML = ""; // Clear previous list

        selectedFiles.forEach((obj, index) => {
          const file = obj.file;
          const li = document.createElement("li");
          li.textContent = file.name;
          li.style.backgroundColor = obj.color;

          // Create buttons for moving the file up and down
          const moveUpBtn = document.createElement("button");
          moveUpBtn.textContent = "Up";
          moveUpBtn.disabled = index === 0; // Disable "Up" for the first file
          moveUpBtn.addEventListener("click", () => moveFile(index, -1));

          const moveDownBtn = document.createElement("button");
          moveDownBtn.textContent = "Down";
          moveDownBtn.disabled = index === selectedFiles.length - 1; // Disable "Down" for the last file
          moveDownBtn.addEventListener("click", () => moveFile(index, 1));

          const controls = document.createElement("div");
          controls.className = "file-controls";
          controls.appendChild(moveUpBtn);
          controls.appendChild(moveDownBtn);

          li.appendChild(controls);
          fileList.appendChild(li);
        });
      }

      // Function to move files up or down
      function moveFile(index, direction) {
        const newIndex = index + direction;
        if (newIndex >= 0 && newIndex < selectedFiles.length) {
          // Swap the files in the selectedFiles array
          [selectedFiles[index], selectedFiles[newIndex]] = [
            selectedFiles[newIndex],
            selectedFiles[index],
          ];
          renderFileList(); // Re-render the file list after the swap
        }
      }

      // Merge PDFs function
      async function mergePDFs(pdfFiles) {
        const mergedPdf = await PDFLib.PDFDocument.create();

        for (let i = 0; i < pdfFiles.length; i++) {
          const arrayBuffer = await pdfFiles[i].arrayBuffer();
          const pdf = await PDFLib.PDFDocument.load(arrayBuffer);
          const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
          pages.forEach((page) => mergedPdf.addPage(page));
        }

        const mergedPdfBytes = await mergedPdf.save();
        downloadMergedPDF(mergedPdfBytes);
      }

      // Download the merged PDF
      function downloadMergedPDF(pdfBytes) {
        const blob = new Blob([pdfBytes], { type: "application/pdf" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = document.getElementById("downloadFileName").value;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      // Handle Merge button click
      document.getElementById("mergeButton").addEventListener("click", () => {
        if (selectedFiles.length > 0) {
          mergePDFs(selectedFiles.map((o) => o.file));
        } else {
          alert("Please select PDF files.");
        }
      });
    </script>
  </body>
</html>
